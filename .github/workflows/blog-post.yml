name: Update Blog Posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@aditya_sharma_09"
          template: "$newline| # $title |"
          max_post_count: 5
          comment_tag_name: "BLOG_POST_LIST"
          committer_username: "aditya226-sharma"
          committer_email: "aditya226sharma@gmail.com"
